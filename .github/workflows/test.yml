name: Test

on:
  pull_request:
  push:
    branches: [main, cube-architecture]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Typechecks (and emits) via tsc, mirroring the publish workflow.
      - run: npm run build

      # A runaway loop — e.g. a resolver that re-triggers itself — surfaces as a
      # heap OOM / "worker exited". Locally that's easy to miss: the summary can
      # still read "passed" above the crash. In CI the exit code is
      # authoritative — a worker OOM makes `npm test` exit non-zero and fails the
      # job, so such regressions fail loudly. The heap cap gives the jsdom suite
      # headroom while still letting a genuine loop die in bounded time.
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Contract tests are typed against the public types (cube/tsconfig.json).
      - run: npm run typecheck:cube

      # Parity of the Cube core with the store (experiments/CubePlan.md).
      # Required since Gate 1 (2026-10-29): the contract slices A and B are
      # green on both implementations.
      - run: npm run test:cube
        env:
          NODE_OPTIONS: --max-old-space-size=4096
