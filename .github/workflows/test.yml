name: Test

on:
  pull_request:
  push:
    branches: [main, cube-architecture]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Typechecks (and emits) via tsc, mirroring the publish workflow.
      - run: npm run build

      # A runaway loop — e.g. a resolver that re-triggers itself — surfaces as a
      # heap OOM / "worker exited". Locally that's easy to miss: the summary can
      # still read "passed" above the crash. In CI the exit code is
      # authoritative — a worker OOM makes `npm test` exit non-zero and fails the
      # job, so such regressions fail loudly. The heap cap gives the jsdom suite
      # headroom while still letting a genuine loop die in bounded time.
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Contract tests are typed against the public types (cube/tsconfig.json).
      - run: npm run typecheck:cube

      # Parity of the Cube core with the store (experiments/CubePlan.md).
      # Required since Gate 1 (2026-10-29): the contract slices A and B are
      # green on both implementations.
      - run: npm run test:cube
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Agent skills (skills/, shipped in the package). `intent validate`:
      # structure, links, examples compiled against the source — check-skills.yml
      # runs it on pull requests only, this covers direct pushes. The task
      # checks (tests/skills): reference solutions type-check under `strict`
      # like a consumer project, each grader accepts the solution and rejects
      # the mistake its skill warns about.
      - run: npm exec --no -- intent validate
      - run: npm run typecheck:skills
      - run: npm run test:skills

  # The demo stand end to end (app-demo/e2e, Playwright): the library from
  # source in a real Next.js app — on the package entry (Cube core), then on
  # the store reference (PALISTOR_IMPL=store), same suite.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app-demo/package-lock.json

      # The library source imports its deps from the repo root (see deploy-demo.yml).
      - name: Install library deps (repo root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - run: npm run test:e2e:store

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app-demo/playwright-report
            app-demo/test-results
