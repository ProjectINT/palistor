name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - "app-demo/**"
      - "react/**"
      - "store/**"
      - "index.ts"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app-demo/package-lock.json

      # The demo consumes the library from its parent source via tsconfig paths
      # (@palistor/* -> ../*). That source (e.g. react/useForm.ts) does
      # `import ... from "react"`, which Node resolves by walking UP from the
      # file's location — so it checks the repo-root node_modules, never
      # app-demo's. Install the library's own deps at the root so its source can
      # type-check during `next build`.
      - name: Install library deps (repo root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install demo deps
        run: npm ci

      - run: npm run build

      # GitHub Pages must not run Jekyll over the Next.js `_next` output.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-demo/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
