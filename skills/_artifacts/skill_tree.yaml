library:
  name: palistor
  version: 0.1.0-cube.0
generated_from:
  domain_map: skills/_artifacts/domain_map.yaml
  skill_spec: skills/_artifacts/skill_spec.md
# Paths never reported as unmapped changes: they hold no guidance and no
# behavior a skill describes (tests, the demo app, plans, repo plumbing).
review:
  ignore:
    - 'tests/**'
    - 'app-demo/**'
    - 'demo-test/**'
    - 'experiments/**'
    - 'docs_archive/**'
    - 'cube/contract/**'
    - 'cube/bench/**'
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '.github/**'
    - '.gitignore'
    - 'LICENSE'
    - '*.png'
    - '*.svg'
    - 'README.md'
    - 'README.ru.md'
    - 'architecture.md'
    - '*Plan.md'
    - 'PALISTOR_AGENT_SKILLS_TZ.md'
    - 'vitest.config.ts'
    - 'tsconfig.build.json'
    - 'cube/tsconfig.json'
skills:
  - name: palistor
    slug: palistor
    domain: forms
    path: skills/palistor/SKILL.md
    description: 'Use when a React project depends on `palistor` and the task is to
      build or change a form, an editable screen or other config-driven UI
      state: declare a field or group config, create a store with `new
      Palistor({ config })`, connect components with `useForm`, add validation,
      required and visibility rules, computed values, formatters, setters,
      submit and reset, async `resolve`, persistence, i18n or error
      notifications. Also use it when such a form misbehaves: errors never
      appear, a hidden field blocks submit, a component does not re-render. Read
      this first. For collections of items use palistor-lists, for step-by-step
      wizards use palistor-flows, for UI-kit prop renaming and input adapters
      use palistor-field-mapping, for rendering on the server in Next.js use
      palistor-ssr.

      '
    sources:
      - ProjectINT/palistor:index.ts
      - ProjectINT/palistor:cube/index.ts
      - ProjectINT/palistor:cube/palistor.ts
      - ProjectINT/palistor:cube/types.ts
      - ProjectINT/palistor:cube/core/cube.ts
      - ProjectINT/palistor:cube/core/config.ts
      - ProjectINT/palistor:cube/core/node.ts
      - ProjectINT/palistor:cube/core/resolve.ts
      - ProjectINT/palistor:cube/core/persist.ts
      - ProjectINT/palistor:cube/core/hub.ts
      - ProjectINT/palistor:cube/react/*.ts
      - ProjectINT/palistor:react/useForm.ts
      - ProjectINT/palistor:store/store/types.ts
      - ProjectINT/palistor:store/store/palistor.ts
      - ProjectINT/palistor:store/resolvePipeline/types.ts
      - ProjectINT/palistor:store/persist/types.ts
    references:
      - references/async-resolve.md
      - references/config-options.md
      - references/integrations.md
      - references/proxy-api.md
      - references/typescript.md
    purpose: "Build forms with the Palistor reactive form state manager. Use when:
      creating form configs, writing React components with useForm, adding
      validation/formatters/setters, working with lists/entities, building
      multi-step wizards/flows (defineFlow/defineStep), configuring
      resolve/persist/submit pipelines, remapping field prop names to UI-library
      conventions (fieldMapping — Ant/MUI/Chakra), debugging form state."
    requires: []
  - name: palistor-lists
    slug: palistor-lists
    domain: lists
    path: skills/palistor-lists/SKILL.md
    description: 'Use when a React screen built with palistor needs a collection of
      records: a table, list or grid of rows loaded from an API with loading,
      error, empty and retry states; adding, removing or inline-editing rows;
      optimistic rows whose temporary id is later replaced by the server id; a
      detail or edit form for one record; sorting the rows by a clicked column
      header, in the browser or by the API; search and filter controls over the
      rows, server-side or in memory, applied as the user types or with an Apply
      button; or page-by-page, load-more and cursor pagination. Covers
      defineList, list and row (entity) proxies, useForm on a row, store.set /
      rekey / delete / invalidate, list filter and sort blocks and
      resolve.pagination. Requires the palistor skill for config, store and
      useForm basics. Step-by-step wizards belong to palistor-flows; renaming
      field props for a UI kit belongs to palistor-field-mapping; rendering the
      list on the server in Next.js belongs to palistor-ssr.

      '
    requires:
      - palistor
    sources:
      - ProjectINT/palistor:cube/defineList.ts
      - ProjectINT/palistor:cube/core/listCube.ts
      - ProjectINT/palistor:cube/core/registry.ts
      - ProjectINT/palistor:cube/core/filter.ts
      - ProjectINT/palistor:cube/core/sort.ts
      - ProjectINT/palistor:cube/core/pagination.ts
      - ProjectINT/palistor:cube/core/resolve.ts
      - ProjectINT/palistor:cube/core/node.ts
      - ProjectINT/palistor:cube/core/hub.ts
      - ProjectINT/palistor:cube/core/cube.ts
      - ProjectINT/palistor:cube/react/useForm.ts
      - ProjectINT/palistor:cube/react/usePalistor.ts
      - ProjectINT/palistor:react/useForm.ts
      - ProjectINT/palistor:store/defineList.ts
      - ProjectINT/palistor:store/store/types.ts
      - ProjectINT/palistor:store/pagination/types.ts
    references:
      - references/entity-editing.md
      - references/filtering.md
      - references/list-api.md
      - references/pagination.md
      - references/sorting.md
    purpose: "Teaches how to model collections in Palistor: declaring a typed list
      with defineList, rendering and editing its rows through entity proxies,
      loading it with a resolver (loading, error, reload), mutating membership
      (add, remove, temporary ids and rekey), editing one entity through a
      separate template, and filtering, sorting or paginating the list."
  - name: palistor-flows
    slug: palistor-flows
    domain: flows
    path: skills/palistor-flows/SKILL.md
    description: 'Use when a React project that depends on palistor needs a form
      split into steps: a signup or onboarding wizard, a checkout, a survey or
      any screen with Next and Back; steps that appear only for some answers
      (branching); checking the current step before moving on and submitting
      everything at the end; a progress indicator with active and completed
      steps; restoring the user''s step after a reload or restarting the wizard.
      Covers defineStep and defineFlow, flow navigation, step entry callbacks,
      flow validation, submit, reset, persisted navigation and typing flow and
      step props. Plain single-screen forms belong to the palistor skill,
      collections of items to palistor-lists.

      '
    requires:
      - palistor
    sources:
      - ProjectINT/palistor:cube/defineFlow.ts
      - ProjectINT/palistor:cube/core/flow.ts
      - ProjectINT/palistor:cube/react/usePalistor.ts
      - ProjectINT/palistor:store/flow/defineFlow.ts
    references:
      - references/flow-api.md
    purpose: "Build step-by-step wizards with palistor flows: declare steps with
      defineStep, assemble them with defineFlow, drive navigation and branching,
      validate each step, finalize the whole flow and type flow and step props."
  - name: palistor-field-mapping
    slug: palistor-field-mapping
    domain: ui-integration
    path: skills/palistor-field-mapping/SKILL.md
    description: 'Use when palistor fields have to be rendered through UI components
      in a React project: wiring a form to MUI, Ant Design, Chakra, HeroUI,
      shadcn or in-house inputs; writing or fixing a reusable text input,
      checkbox or select wrapper that receives a whole field through a JSX
      spread; making field props use the UI kit''s names (required, disabled,
      error, helperText) with fieldMapping or defineFieldMapping; fixing React
      unknown-prop warnings, props leaking to the DOM, hidden fields that still
      render, inputs that do not update, or renamed props that lost their types.
      Covers one adapter per input kind, the single-vocabulary rule for mapped
      configs, typing adapter and subtree props, and the limits of renaming
      (names only, no value conversion). Field rules themselves (validation,
      visibility) belong to the palistor skill.

      '
    requires:
      - palistor
    sources:
      - ProjectINT/palistor:cube/core/mapping.ts
      - ProjectINT/palistor:store/defineFieldMapping.ts
      - ProjectINT/palistor:store/constants.ts
    purpose: "Connect palistor fields to a UI component library: one adapter
      component per input kind fed by a field spread, and fieldMapping /
      defineFieldMapping to rename field props to the vocabulary of the UI kit,
      with correct typing of the renamed props."
  - name: palistor-ssr
    slug: palistor-ssr
    domain: server-rendering
    path: skills/palistor-ssr/SKILL.md
    description: "Use when a palistor form, list or wizard is rendered on the server
      in a Next.js App Router project (or any React server render): the first
      HTML must contain the rows or values a Server Component fetched and the
      translated labels, the server must send no request for the store,
      hydration must report no mismatch and the browser must not fetch the same
      data again. Also use it when the page source shows translation keys or an
      empty list, when a hydration warning points at a palistor screen, when a
      store is needed per mounted component, or one global store for a whole
      server-rendered app (the signed-in user, a cart), instead of one per
      module, or when a Node script or a test without a DOM never sees its
      resolver run. Covers usePalistor, PalistorProvider, usePalistorContext,
      the options initialData, translator, notifier and server, store.start(),
      loading and Suspense on the server. Requires the palistor skill (config,
      store, useForm); the list itself (defineList, filters, pagination) belongs
      to palistor-lists.\n"
    sources:
      - ProjectINT/palistor:cube/palistor.ts
      - ProjectINT/palistor:cube/types.ts
      - ProjectINT/palistor:cube/react/usePalistor.ts
      - ProjectINT/palistor:cube/react/provider.tsx
      - ProjectINT/palistor:cube/core/restore.ts
      - ProjectINT/palistor:cube/core/hub.ts
      - ProjectINT/palistor:cube/core/resolve.ts
      - ProjectINT/palistor:cube/core/pagination.ts
      - ProjectINT/palistor:cube/core/flow.ts
      - ProjectINT/palistor:cube/core/cube.ts
      - ProjectINT/palistor:cube/core/listCube.ts
      - ProjectINT/palistor:cube/core/node.ts
    requires:
      - palistor
    purpose: "Render palistor forms, lists and wizards on the server in Next.js App
      Router: create one store per component instance with usePalistor, hand it
      the data a Server Component fetched through initialData, share context,
      translator and notifier through PalistorProvider, and keep the server
      render free of store requests and the hydration free of mismatches and
      repeated fetches."
distribution:
  mode: repo
  repository: ProjectINT/palistor
  name: palistor
  skills:
    - palistor
    - palistor-lists
    - palistor-flows
    - palistor-field-mapping
    - palistor-ssr
