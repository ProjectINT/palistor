  - name: palistor-flows
    slug: palistor-flows
    domain: flows
    description: "A developer is building a screen the user moves through step by step: a wizard, onboarding, checkout or survey, possibly with branches."
    type: sub-skill
    covers:
      - "defineStep(key, config) and defineFlow({ steps, onSubmit, beforeSubmit, afterSubmit })"
      - "flow proxy: currentStepKey, currentStepIndex, canGoBack, history, errors, steps, values"
      - "nextStep, back, goTo, validate, submit, reset"
      - "step status and the steps collection"
      - "branching through a step isVisible"
      - "step entry lifecycle: onEnter, resolve, onReady (not entered without `window` until store.start(); in a usePalistor store the first step is entered after the component's first commit)"
      - "persisted navigation"
      - "FlowProxyNode, FlowStepProxy, FlowStepsProxy, FlowValues, StepStatus, FlowError"
    tasks:
      - "Build a multi-step wizard with next and back navigation"
      - "Branch a wizard by hiding steps based on earlier answers"
      - "Validate each step on Next and finalize the whole flow on the last step"
      - "Show a progress indicator from step statuses"
      - "Restore the wizard step after a reload"
    reference_candidates:
      - topic: "flow API"
        reason: "full flow, steps-collection and step surfaces, exported types, lifecycle and reset rules"
