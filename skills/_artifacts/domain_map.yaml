        documented_in: skills/palistor/references/async-resolve.md
  - name: palistor-lists
    slug: palistor-lists
    domain: lists
    description: "A developer needs a collection of same-shaped records in a palistor screen: load, render, add, remove and edit rows, edit one record in its own form, filter and paginate."
    type: sub-skill
    covers:
      - "defineList<TEntity>({ template, resolve, filter, sort })"
      - "list proxy: items, map, length, loading, error, resolveStatus, reload, add, remove, setItems, getById, getValues, dirty"
      - "entity (row) proxies and useForm(row) / useForm(row, templateSelector)"
      - "store.set / rekey / delete / invalidate; temporary ids"
      - "row validation and row submit"
      - "template field resolve and template resolve"
      - "filter block: server and client fields, where, param, debounce, $all (runs only with a where field), $toParams (not the request identity), list.filter controls"
      - "filter Apply mode: $apply: \"manual\" / apply per field, drafts vs applied values, filter.apply() / revert() / isDraft / applied, useForm(props.filter)"
      - "sort block: sort: true or named fields (true, { by }, { compare }, { param }), $default, $locale, $server; list.sort (toggle, set, clear, reset, refresh, dirOf, sortDescriptor / onSortChange); the client order as a snapshot; the server class (ctx.sort, one request per change, $sort in the page key); SortProxyNode / SortKey typing"
      - "resolve.pagination: paged, infinite, cursor; page cache; PagedResult and ctx.page; nextCursor: null ends a cursor / infinite feed"
      - "lists nested in a row: filled by their own resolver, add / setItems or initialData (not by the outer resolver); dirty goes up to the owner row, its list and the form; store.reset() returns them to the loaded rows and requests nothing"
      - "list onError(error, { notify, t }): the cast form inside defineList"
      - "PalistorRef, PalistorList, InferEntity, TemplateConfig, ListResolver"
    tasks:
      - "Render and edit a server-loaded list with loading, error and reload states"
      - "Add, remove and edit list items, including optimistic rows with temporary ids"
      - "Edit one entity through a separate template with its own validation and submit"
      - "Filter a list with server and client filter fields"
      - "Paginate a list (paged, infinite or cursor mode)"
      - "Sort a table by a clicked column header in the browser (client class), including client-side pages and a Re-sort after edits"
      - "Sort a paginated or first-N list on the server (ctx.sort, $server: true)"
      - "Build a filter panel with Apply and Cancel over a server list (manual mode)"
    reference_candidates:
      - topic: "list API"
        reason: "full list, row and row-field surfaces, store entity methods, typing helpers"
      - topic: "entity editing"
        reason: "separate edit template, three levels of loading, row submit"
      - topic: "filtering"
        reason: "filter block vocabulary and server/client field rules"
      - topic: "pagination"
        reason: "three modes, more than 20 list members, cache and persistence options"
      - topic: "sorting"
        reason: "block grammar, two classes (browser and server), the snapshot rule, comparison defaults, $locale under SSR, React Aria tables"
    failure_modes:
