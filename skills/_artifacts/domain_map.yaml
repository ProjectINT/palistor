# domain_map.yaml
# Library: palistor
# Version: 0.1.0-cube.0
# Date: 2026-11-15, updated 2026-11-23 (batch 2: palistor-ssr; server mode and the `loading` rule),
#       updated 2026-11-24 (batch 3: Stage 5а, fixes after the SSR demo; verified against the working
#       tree at package.json 0.1.0-cube.1),
#       updated 2026-11-24 (batch 4: one store for the whole app; verified at 69dc215, package.json
#       0.1.1-cube.1),
#       updated 2026-11-24 (batch 5: a node as a prop on every level, the field overload of useForm;
#       verified against the working tree on 69dc215, package.json 0.1.1-cube.1),
#       updated 2026-11-24 (batch 6: list sorting, client and server class, and the filter's Apply
#       mode; verified at c239cd8, package.json 0.1.1-cube.2),
#       updated 2026-11-24 (batch 7: release audit of the batch 6 guidance against cube/**; verified
#       at 7572329, package.json 0.1.1-cube.3)
# Status: draft (the seven batches were authored by an agent; not yet reviewed by the maintainer)
#
# failure_modes list the mistake, its priority and evidence. The wrong and correct
# patterns and the mechanism live in one place only: the skill file named in
# `documented_in`, under a heading equal to `mistake`.

library:
  name: palistor
  version: 0.1.0-cube.0
  repository: https://github.com/ProjectINT/palistor
  description: "Declarative config-driven state for React: forms, lists and step wizards"
  primary_framework: React

domains:
  - name: "Forms and form state"
    slug: forms
    description: "Fields, groups and the rules between them: validation, visibility, computed values, submit, reset, loading data, drafts"
  - name: "Collections of records"
    slug: lists
    description: "Lists of entities: loading, membership, row editing, filtering, pagination"
  - name: "Step-by-step screens"
    slug: flows
    description: "Wizards: steps, navigation, branching, per-step and final validation"
  - name: "UI component integration"
    slug: ui-integration
    description: "The hop from a field to a UI component: adapters and prop renaming"
  - name: "Server rendering"
    slug: server-rendering
    description: "A store under a server render: data, translations and context in the first HTML, nothing started on the server, hydration without a mismatch or a repeated request"

skills:
  - name: palistor
    slug: palistor
    domain: forms
    description: "A developer is building or changing a form, an editable screen or other config-driven UI state: fields and groups, validation, conditional and computed fields, submit and reset, loading data into the form, drafts, translations."
    type: core
    covers:
      - "config tree: leaf (value) and group nodes"
      - "new Palistor({ config, initialValues, context, translator, notifier })"
      - "store.start() and the no-`window` rule (a store starts nothing by itself in Node; a usePalistor store starts after its component's first commit: palistor-ssr)"
      - "useForm(store) / useForm(node from a prop: a group or a single field) and the field spread; the component tree mirrors the config tree, level after level"
      - "validate, isRequired, isVisible, isDisabled, isReadOnly, computed value"
      - "formatter, setter, onChange"
      - "submit / reset / setValues on the root, a group or a field; SubmitResult"
      - "group resolve (async loading); onError(error, { notify, t }) and its two strict-TypeScript forms; a group has no reload / resolveStatus / error"
      - "usePersist, useTranslator, useNotifier, useStoreContext"
      - "ExtractValues, DeepPartialValues, PalistorProxy, FieldProxyNode"
      - "routing to the four sub-skills"
    tasks:
      - "Build a form with required, conditional and computed fields and submit it"
      - "Show validation errors only after the first submit attempt"
      - "Split a form into components that mirror the config, level after level down to one component per field, each re-rendering on its own"
      - "Load data into a form from an API and reload it when an input changes"
      - "Persist a draft, translate labels and report load errors"
      - "Type form values, component props and config callbacks under strict TypeScript"
      - "Diagnose a form that does not submit, does not show errors or does not re-render"
    reference_candidates:
      - topic: "config options"
        reason: "more than 20 config keys with distinct signatures and value scopes; write and submit order"
      - topic: "proxy and store API"
        reason: "field, group and store members not needed on the common path"
      - topic: "async resolve"
        reason: "a conditional task (loading data) with its own options and mistakes"
      - topic: "integrations"
        reason: "four optional hooks: persist, i18n, notifications, store context"
      - topic: "TypeScript"
        reason: "typing rules needed only at component boundaries and for strict mode"
    failure_modes:
      - mistake: "Form logic in useState / useEffect instead of the config"
        priority: CRITICAL
        status: active
        source: "README \"Idea\", cube/core/cube.ts (write, rawError)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "A hidden field still blocks submit"
        priority: CRITICAL
        status: active
        source: "cube/core/cube.ts (collectErrors)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Passing store.proxy (or a part of it) to useForm"
        priority: HIGH
        status: active
        source: "store/store/types.ts (RawStoreProxyMarker), cube/react/useForm.ts"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Reading state in render without useForm"
        priority: HIGH
        status: active
        source: "cube/react/useForm.ts"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Expecting the whole form in a nested field's values"
        priority: HIGH
        status: active
        source: "cube/core/cube.ts (scopeValues)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "A number field fed by a text input"
        priority: HIGH
        status: active
        source: "cube/core/cube.ts (write)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Reading validity that is not there yet"
        priority: HIGH
        status: active
        source: "cube/core/cube.ts (isInvalid, revalidate)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "useForm(store, selector)"
        priority: MEDIUM
        status: active
        source: "cube/react/useForm.ts (resolveEntity)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Root submit where a group submit was meant"
        priority: MEDIUM
        status: active
        source: "cube/core/cube.ts (submit)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Changing the config object after the store exists"
        priority: MEDIUM
        status: active
        source: "cube/core/cube.ts (constructor)"
        documented_in: skills/palistor/SKILL.md
      - mistake: "Omitting onError"
        priority: HIGH
