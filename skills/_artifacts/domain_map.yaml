tensions:
  - name: "Hide a field vs keep the form submittable"
    skills: [palistor, palistor-flows]
    description: "isVisible hides a field but submit still validates it; only a hidden flow step is exempt."
    implication: "An agent that only hides a required field ships a form that cannot be submitted; one that expects the flow exemption in a plain form gets the same result."
  - name: "Inferred config vs typed callbacks"
    skills: [palistor, palistor-lists, palistor-flows, palistor-field-mapping]
    description: "The config must stay an inferred literal for precise proxy types, yet nothing then types callback parameters."
    implication: "Un-annotated callbacks pass the Intent validator (strict: false) and fail the consumer build with TS7006; annotating the config as FormConfig breaks the proxy types instead."
  - name: "One vocabulary under a field mapping"
    skills: [palistor, palistor-field-mapping]
    description: "Core examples use palistor names (isRequired); with a fieldMapping the same config must use the mapped names."
    implication: "Copying a core example into a mapped store throws at module load."
  - name: "Form field rules vs row field rules"
    skills: [palistor, palistor-lists]
    description: "A form field validates isRequired and hides errors until submit; a row field ignores isRequired and validates live."
    implication: "Reusing form-field expectations in a list template yields rows that are never invalid."
  - name: "Module-level store vs a store per component instance"
    skills: [palistor, palistor-ssr]
    description: "The core skill creates the store at module level; a screen rendered on the server with request data needs one store per component instance (usePalistor), because a module is shared by every request and initialData exists only in the constructor. A store the whole app shares is per instance too: one provider in the layout calls usePalistor and hands the store down through a React context, which only the entry of each client subtree reads; below it nodes are props, as everywhere else."
    implication: "An agent that keeps the module-level habit on a server-rendered screen either cannot hand over the server's rows or writes one user's rows into a store every request shares. An agent asked for a global store either does the same at module level, or calls usePalistor in every component and gets as many stores as callers."
  - name: "initialValues vs initialData"
    skills: [palistor, palistor-ssr]
    description: "initialValues are defaults for fields; initialData is a result: it also fills lists and marks a resolve as answered."
    implication: "Server data passed as initialValues leaves the list empty or the resolve unanswered: the server sends a skeleton and the browser requests the data again. For a typed list it does not compile (TS2345)."
  - name: "Automatic dependency tracking vs initialData"
    skills: [palistor, palistor-lists, palistor-ssr]
    description: "The core and lists skills say there is nothing to declare: a resolver re-runs on what it read. A resolve that got initialData has not run, so only declared dependencies restart it until its first real run. A list also has reload(); a group has none."
    implication: "A list that started from server rows silently ignores a field its resolver reads unless that field is in deps or is a filter field."
  - name: "A store that starts in its constructor vs a store that starts after the commit"
    skills: [palistor, palistor-lists, palistor-flows, palistor-ssr]
    description: "The core, lists and flows skills say an eager resolve and the first step start when the store is created; that holds for new Palistor() in the browser. A usePalistor store is held until its component has committed."
    implication: "An agent that expects a called resolver, resolveStatus \"pending\" or onEnter inside the first render of a usePalistor screen, or that lifts the hook above a Suspense boundary to save requests, follows a rule that no longer exists."
  - name: "initialData vs a resolver's result for nested lists"
    skills: [palistor-lists, palistor-ssr]
    description: "initialData (and a restored draft) fills the lists nested in rows from the rows; a list's resolver does not."
    implication: "An agent that returns nested arrays from the outer list's resolver gets empty nested lists that fetch on their first read."

  - name: "A client sort's snapshot vs a client filter's live projection"
    skills: [palistor-lists]
    description: "A client filter follows row edits at once (a row that stops matching disappears); a client sort is a snapshot: an edited row stays in place and an added row goes last until a sort action, a load, setItems or sort.refresh()."
    implication: "An agent that expects the sort to behave like the filter ships a table whose ▲ column is out of order after inline edits or realtime updates; one that re-sorts in the component to fix it loses the stable order and sorts one page only."
  - name: "Draft values vs applied values in a manual filter"
    skills: [palistor-lists]
    description: "In manual mode filter.<field>.value and filter.values show the drafts; the rows, ctx.filter, isActive, activeCount and filter.applied follow the applied values; set / reset / clear write drafts."
    implication: "An agent that reads filter.values to show the active filters, or calls clear() alone for a Clear button, shows chips and counts that do not match the rows."

cross_references:
  - from: palistor
    to: palistor-lists
    reason: "A form with a collection needs defineList; store.set / rekey / delete / invalidate and the two-argument useForm are documented there."
  - from: palistor
    to: palistor-flows
    reason: "A multi-step screen is a flow; hidden steps are the only fields exempt from submit validation."
  - from: palistor
    to: palistor-field-mapping
    reason: "The core skill shows one native adapter; UI-kit adapters and prop renaming live there."
  - from: palistor-lists
    to: palistor
    reason: "Assumes config, store, useForm and group resolve options."
  - from: palistor-flows
    to: palistor
    reason: "A flow is a group and every step is a group; resolve options and usePersist are documented in the core skill."
  - from: palistor-field-mapping
    to: palistor
    reason: "Field rules and the strict-mode annotation rule are stated in the core skill."
  - from: palistor-field-mapping
    to: palistor-lists
    reason: "A mapping also renames dirty / loading on lists and rows, never list methods or pagination members."
  - from: palistor
    to: palistor-ssr
    reason: "Rendering on the server: usePalistor and PalistorProvider replace the module-level store and the effect hooks; the no-`window` rule, store.start() and the moment a usePalistor store starts are detailed there."
  - from: palistor-lists
    to: palistor-ssr
    reason: "Rows a Server Component fetched go to the list through initialData (nested lists included); the first page of a paginated list, the declared-dependency limit and the held first render of a usePalistor store are documented there. A server-sorted list's initialData answers $default; a client-sorted list needs $locale (sorting reference)."
  - from: palistor-flows
    to: palistor-ssr
    reason: "A wizard rendered on the server enters no step until the browser, and in a usePalistor store not before the component's first commit; a step whose data came as initialData gets onReady right after onEnter."
  - from: palistor-ssr
    to: palistor
    reason: "Assumes config, store, useForm, group resolve options (deps, contextDeps, suspense) and usePersist."
  - from: palistor-ssr
    to: palistor-lists
    reason: "The list itself: defineList, filter blocks, pagination and the loading / resolveStatus states."
  - from: palistor-ssr
    to: palistor-flows
    reason: "Step lifecycle (onEnter, resolve, onReady) and navigation."

